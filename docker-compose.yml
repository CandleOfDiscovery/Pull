services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jobpull:jobpull@postgres:5432/jobpull}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on:
      api: { condition: service_healthy }
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: jobpull, POSTGRES_USER: jobpull, POSTGRES_PASSWORD: jobpull }
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U jobpull -d jobpull"], interval: 10s, timeout: 5s, retries: 5 }
  redis:
    image: redis:7-alpine
    volumes: [redis-data:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 5 }
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"], interval: 15s, timeout: 10s, retries: 10 }
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment: { discovery.type: single-node, DISABLE_SECURITY_PLUGIN: "true", OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m" }
    ports: ["9200:9200"]
    healthcheck: { test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health"], interval: 20s, timeout: 10s, retries: 10 }
volumes: { postgres-data: {}, redis-data: {} }
